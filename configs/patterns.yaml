patterns:
  sms_code:
    category: verification
    description: "Комбинации про код и смс."
    regex: "(код\\w*\\s+(?:из\\s+)?смс|смс\\s+код|код\\w*\\s+подтвержден\\w*)"

  transfer_money:
    category: money
    description: "Призывы перевести деньги."
    regex: "(перевед(?:ите|и)\\s+(?:средств\\w*|деньг\\w*)|перевод\\w*\\s+денег)"

  safe_account:
    category: money
    description: "Безопасный или резервный счет."
    regex: "((?:безопасн\\w*|резервн\\w*|защитн\\w*)\\s+счет\\w*)"

  bank_security:
    category: authority
    description: "Служба безопасности банка."
    regex: "(служб\\w*\\s+безопасност\\w*|сотрудник\\w*\\s+банка)"

  authority_org:
    category: authority
    description: "Государственные и окологосударственные структуры."
    regex: "(мвд|полиц\\w*|прокуратур\\w*|следственн\\w*\\s+комитет\\w*|центробанк\\w*|банк\\s+росси\\w*|госуслуг\\w*)"

  urgency:
    category: urgency
    description: "Срочность и запрет завершать разговор."
    regex: "(срочн\\w*|немедленн\\w*|прямо\\s+сейчас|не\\s+кладите\\s+трубк\\w*|не\\s+отключа\\w*|оставайтесь\\s+на\\s+линии)"

  credit:
    category: credit
    description: "Упоминания кредита и заявки."
    regex: "(оформлен\\w*\\s+кредит\\w*|заявк\\w*\\s+на\\s+кредит\\w*|кредит\\w*\\s+одобрен\\w*|заявк\\w*\\s+по\\s+кредитовани\\w*)"

  sim_contract:
    category: sim
    description: "Сим-карта и договор связи."
    regex: "(сим\\s*карт\\w*|замен\\w*\\s+сим|перевыпуск\\w*\\s+сим|продлит\\w*\\s+договор\\w*|оператор\\w*\\s+связ\\w*)"

  relative_emergency:
    category: relative_emergency
    description: "Беда родственника или новый номер."
    regex: "(новый\\s+номер\\w*|родственник\\w*\\s+в\\s+бед\\w*|срочн\\w*\\s+нужн\\w*\\s+деньг\\w*|попал\\w*\\s+в\\s+больниц\\w*)"
